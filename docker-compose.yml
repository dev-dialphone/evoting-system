version: '3.9'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=change-me-in-production
      - DATABASE_URL=sqlite:////app/data/evoting.db
      - MAIL_SERVER=localhost
      - MAIL_PORT=1025
      - MAIL_USE_TLS=false
    volumes:
      - evoting_data:/app/data
      - evoting_uploads:/app/evoting/static/uploads
    restart: unless-stopped

volumes:
  evoting_data:
  evoting_uploads:
